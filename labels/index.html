    const b=BASE&&!BASEAUTO?val(BASE,k):null;   // compare only with a real base (StarStrings), not with an earlier copy of the same file
    const m=/^(\d+\s*[.)\-]\s*|\[[^\]]*\]\s*|[★☆*#]+\s*)(.+)$/.exec(u);
    if(b!=null){if(u===b)continue;const n=x=>x.replace(/["'“”]/g,"");const nu=n(u),nb=n(b);
      if(nu.endsWith(nb)){veh.push({k,pre:nu.slice(0,nu.length-nb.length),suf:""});continue}
      if(nu.startsWith(nb)){veh.push({k,pre:"",suf:nu.slice(nb.length)});continue}}
    if(m)veh.push({k,pre:m[1],suf:""})}
  for(const v of veh)v.pre=v.pre.replace(/^(?:\d+\s*[.)\-]\s*)+/,m=>(/\d+\s*[.)\-]\s*$/.exec(m)||[m])[0]);   // "1. 1. " (labelled twice) -> "1. "
  veh.sort((a,b)=>(parseInt(a.pre)||999)-(parseInt(b.pre)||999));
  return {tpl:best&&hits>=Math.max(3,items.length*0.3)?best:null,hits,total:items.length,veh}}

/* ---------------- UI ---------------- */
function save(){try{localStorage.setItem(LSK,JSON.stringify({tpl:TPL,veh:VEH,note:NOTE,price:PRICE,num:AUTONUM}))}catch(e){}}
function sample(){const base=BASE||OLD;const ks=["item_namecool_aegs_s01_tundra","item_namepowr_jspn_s01_jsrmk2","item_nameshld_godi_s01_allstop_scitem","item_nameqdrv_rsi_s01_lightfire","item_name_radr_bltr_s01_hunter"];
  const out=[];for(const k of ks.concat(Object.keys(COMP))){if(out.length>=4)break;const it=base?item(k,base):null;if(it)it.name=stripLbl(it.name,it);if(it&&!out.some(o=>o.type===it.type))out.push(it)}
  if(!out.length)out.push({type:"COOL",size:"1",grade:"D",cls:"MIL",name:"Tundra"},{type:"QDRV",size:"2",grade:"A",cls:"CMP",name:"Spectre"});
  return out}
function drawTpl(){
  const sel=(tk,i)=>tk.k==="type"||tk.k==="class"?`<select data-i="${i}">${["code","long","short","letter"].map(s=>`<option value="${s}" ${tk.s===s?"selected":""}>${t("st"+s[0].toUpperCase()+s.slice(1))}</option>`).join("")}</select>`:"";
  const lab={type:"tType",class:"tClass",size:"tSize",grade:"tGrade",name:"tName"};
  $("#tpl").innerHTML=TPL.map((tk,i)=>tk.k==="lit"?`<span class="tok lit">${t("tText")} <input data-i="${i}" value="${esc(tk.v)}"><button data-l="${i}" title="←">‹</button><button data-r="${i}" title="→">›</button><button data-x="${i}">✕</button></span>`
    :`<span class="tok">${t(lab[tk.k])} ${sel(tk,i)}<button data-l="${i}">‹</button><button data-r="${i}">›</button><button data-x="${i}">✕</button></span>`).join("")||`<span class="hint">${t("off")}</span>`;
  $("#addt").innerHTML=`<span class="hint">${t("addTok")}</span>`+["type","class","size","grade","name","lit"].map(k=>`<button class="btn" data-a="${k}">+ ${t(k==="lit"?"tText":lab[k])}</button>`).join("");
  $("#prev").innerHTML=sample().map(it=>`<span class="k">${esc(it.name)}</span><span class="v">${esc(isOff(TPL)?it.name:render(TPL,it))}</span>`).join("")+(COMPV?`<span class="k"></span><span class="hint">${t("compD",Object.keys(COMP).length,esc(COMPV.split("-")[0]))}</span>`:"");
  $("#tpl").querySelectorAll("select").forEach(s=>s.onchange=()=>{TPL[+s.dataset.i].s=s.value;save();drawTpl()});
  $("#tpl").querySelectorAll("input").forEach(s=>s.oninput=()=>{TPL[+s.dataset.i].v=s.value;save();drawPrev()});
  $("#tpl").querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{TPL.splice(+b.dataset.x,1);save();drawTpl()});
  $("#tpl").querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{const i=+b.dataset.l;if(i>0){[TPL[i-1],TPL[i]]=[TPL[i],TPL[i-1]];save();drawTpl()}});
  $("#tpl").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const i=+b.dataset.r;if(i<TPL.length-1){[TPL[i+1],TPL[i]]=[TPL[i],TPL[i+1]];save();drawTpl()}});
  $("#addt").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const k=b.dataset.a;TPL.push(k==="lit"?{k,v:" "}:k==="type"||k==="class"?{k,s:"code"}:{k});save();drawTpl()})}
function drawPrev(){$("#prev").querySelectorAll(".v").forEach((e,i)=>{const it=sample()[i];if(it)e.textContent=isOff(TPL)?it.name:render(TPL,it)})}
const PRESETS={
 ud:[{k:"type",s:"code"},{k:"lit",v:" -"},{k:"class",s:"code"},{k:"lit",v:" -"},{k:"size"},{k:"lit",v:"-"},{k:"grade"},{k:"lit",v:" -"},{k:"name"}],
 ss:[{k:"class",s:"short"},{k:"lit",v:"/"},{k:"size"},{k:"lit",v:"/"},{k:"grade"},{k:"lit",v:" "},{k:"name"}],
 br:[{k:"lit",v:"["},{k:"size"},{k:"grade"},{k:"lit",v:" "},{k:"class",s:"short"},{k:"lit",v:"] "},{k:"name"}],
 off:[]};
function vname(k){const v=VEH.find(x=>x.k===k)||{k,pre:"",suf:""};const x=vbase(v);return x==null?k.replace(/^vehicle_name_?/i,"").replace(/_/g," "):x}   // no file loaded yet: readable key
function drawVeh(){
  if(!VEH.length){$("#vt").innerHTML=[1,2,3].map(i=>`<tr class="ph"><td class="dh">⠿</td><td></td><td class="nm">${t("vehN")} ${i}.</td><td></td><td class="res">${AUTONUM?i+". ":""}${t("vehN")}</td><td></td></tr>`).join("");return}
  $("#vt").innerHTML=VEH.map((v,i)=>`<tr data-i="${i}"><td class="dh" title="${t("dragH")}">⠿</td><td><input data-p="${i}" value="${esc((v.pre||"").replace(NUMS,""))}" placeholder="${t("before")}"></td><td class="nm">${esc(vname(v.k))}</td><td><input data-s="${i}" value="${esc(v.suf)}" placeholder="${t("after")}"></td><td class="res">${esc(vpre(v,i)+vname(v.k)+v.suf)}</td><td><button data-x="${i}">✕</button></td></tr>`).join("");
  const res=(i)=>{const tr=$("#vt").querySelector(`tr[data-i="${i}"] .res`);if(tr)tr.textContent=vpre(VEH[i],i)+vname(VEH[i].k)+VEH[i].suf};
  $("#vt").querySelectorAll("[data-p]").forEach(e=>e.oninput=()=>{VEH[+e.dataset.p].pre=e.value.replace(NUMS,"");save();res(+e.dataset.p)});
  $("#vt").querySelectorAll("[data-s]").forEach(e=>e.oninput=()=>{VEH[+e.dataset.s].suf=e.value;save();res(+e.dataset.s)});
  $("#vt").querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{VEH.splice(+b.dataset.x,1);save();drawVeh()});
  // drag & drop by the handle (mouse and touch)
  $("#vt").querySelectorAll(".dh").forEach(h=>h.onpointerdown=e=>{e.preventDefault();let from=+h.closest("tr").dataset.i;const row=h.closest("tr");row.classList.add("drag");h.setPointerCapture(e.pointerId);
    h.onpointermove=ev=>{const el=document.elementFromPoint(ev.clientX,ev.clientY),tr=el&&el.closest&&el.closest("#vt tr");if(!tr||tr===row)return;
      const to=+tr.dataset.i,tb=row.parentNode;
      while(from!==to){const dn=to>from,nb=dn?row.nextElementSibling:row.previousElementSibling;if(!nb)break;   // move the neighbours, not the dragged row (keeps the pointer capture)
        if(dn)row.before(nb);else row.after(nb);const j=dn?from+1:from-1;[VEH[from],VEH[j]]=[VEH[j],VEH[from]];from=j}
      [...tb.children].forEach((r,j)=>r.dataset.i=j);[...tb.children].forEach((r,j)=>{const c=r.querySelector(".res");if(c)c.textContent=vpre(VEH[j],j)+vname(VEH[j].k)+VEH[j].suf})};
    h.onpointerup=h.onpointercancel=()=>{h.onpointermove=null;row.classList.remove("drag");save();drawVeh()}})}
$("#vq").oninput=()=>{const q=$("#vq").value.trim().toLowerCase(),b=BASE||OLD,r=$("#vres");
  if(!q||!b){r.hidden=true;return}
  const hits=[];for(const [lk,[k,v]] of b.map){if(lk.startsWith("vehicle_name")&&!/_short$|desc/i.test(lk)&&v.toLowerCase().includes(q)&&!VEH.some(x=>x.k.toLowerCase()===lk)){hits.push([k,v]);if(hits.length>=30)break}}
  r.innerHTML=hits.map(([k,v])=>`<div data-k="${esc(k)}">${esc(v)}</div>`).join("");r.hidden=!hits.length;
  r.querySelectorAll("div").forEach(d=>d.onclick=()=>{VEH.push({k:d.dataset.k,pre:"",suf:""});$("#vq").value="";r.hidden=true;save();drawVeh()})};

function readFile(f){return f.text()}
async function loadOld(f){const txt=await readFile(f);const ini=parseIni(txt);
  if(ini.n<1000){$("#detect").innerHTML=`<p class="err">${t("notIni")}</p>`;return}
  OLD=ini;const d=detect();
  if(d.tpl){TPL=d.tpl;OLDTPL=d.tpl}
  VEH=d.veh;if(VEH.some(v=>/^\d/.test(v.pre||"")))AUTONUM=true;VEH.forEach(v=>v.pre=(v.pre||"").replace(NUMS,""));$("#cNum").checked=AUTONUM;save();
  const ss=/\[BP\]|<EM4>/.test(txt.slice(0,3000000));
  $("#detect").innerHTML=`<p class="${d.tpl?"ok":"warn"}">${d.tpl?"✓ "+t("detOk",d.hits,d.total,d.veh.length):t("detNone",d.veh.length)}</p>`+(ss?`<p class="hint">${t("detSS")}</p>`:"");
  $("#s1st").textContent="✓ "+f.name;
  if(!BASE||BASEAUTO){await setBase(txt,t("fromS1",f.name));BASEAUTO=true}   // one upload is enough: the same file is the base until StarStrings / another file is chosen
  drawTpl();drawVeh()}
async function setBase(txt,label){const ini=parseIni(txt);if(ini.n<1000)throw new Error(t("notIni"));BASE=ini;BASEN=label;BASEAUTO=false;
  $("#baseInfo").innerHTML=`<p class="ok">✓ ${t("baseOk",esc(label),ini.n.toLocaleString())}</p>`;$("#s2st").textContent="✓";$("#bGo").disabled=false;
  if(OLD){const d=detect();if(!VEH.length)VEH=d.veh}drawTpl();drawVeh()}
$("#bSS").onclick=async()=>{const bi=$("#baseInfo");bi.innerHTML=`<p class="hint">${t("loading")}</p>`;
  try{const R="https://raw.githubusercontent.com/MrKraken/StarStrings/master/";
    const [ini,rd]=await Promise.all([fetch(R+"src/For_Players/Data/Localization/english/global.ini",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}),fetch(R+"readme.md",{cache:"no-store"}).then(r=>r.ok?r.text():"").catch(()=>"")]);
    const b=/Build:\s*([^\]\*]+)\]/.exec(rd);await setBase(ini,"StarStrings"+(b?" · "+b[1].trim():""))}
  catch(e){bi.innerHTML=`<p class="err">${t("baseErr",esc(e.message||e))}</p>`}};
$("#bOwnBase").onclick=()=>$("#fBase").click();
$("#fBase").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{await setBase(await readFile(f),f.name)}catch(er){$("#baseInfo").innerHTML=`<p class="err">${esc(er.message)}</p>`}};
const drop=$("#dropOld");drop.onclick=()=>$("#fOld").click();
$("#fOld").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)loadOld(f)};
drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("hov")});drop.addEventListener("dragleave",()=>drop.classList.remove("hov"));
drop.addEventListener("drop",e=>{e.preventDefault();drop.classList.remove("hov");const f=e.dataTransfer.files[0];if(f)loadOld(f)});
$("#bFresh").onclick=()=>{OLD=null;TPL=PRESETS.ud.map(x=>({...x}));VEH=[];save();$("#detect").innerHTML="";$("#s1st").textContent="";drawTpl();drawVeh()};
document.querySelectorAll("[data-p]").forEach(b=>{if(b.closest("#s3"))b.onclick=()=>{TPL=PRESETS[b.dataset.p].map(x=>({...x}));save();drawTpl()}});
$("#bSaveCfg").onclick=()=>{const blob=new Blob([JSON.stringify({app:"shogy-label-forge",v:1,tpl:TPL,veh:VEH},null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="label-forge-settings.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
$("#bLoadCfg").onclick=()=>$("#fCfg").click();
$("#fCfg").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const d=JSON.parse(await f.text());if(Array.isArray(d.tpl))TPL=d.tpl;if(Array.isArray(d.veh))VEH=d.veh.map(v=>({...v,pre:(v.pre||"").replace(NUMS,"")}));save();drawTpl();drawVeh();$("#s1st").textContent="✓ "+f.name}catch(er){$("#detect").innerHTML=`<p class="err">${esc(er.message)}</p>`}};

$("#bGo").onclick=()=>{
  if(!BASE){$("#out").innerHTML=`<p class="warn">${t("needBase")}</p>`;return}
  const rep=new Map();let nc=0,nv=0;
  for(const k of compKeys(BASE)){const it=item(k,BASE);if(!it)continue;it.name=stripLbl(it.name,it);rep.set(k,isOff(TPL)?it.name:render(TPL,it));nc++}
  VEH.forEach((v,i)=>{const b=vbase(v);if(b==null)return;rep.set(v.k.toLowerCase(),vpre(v,i)+b+v.suf);nv++});
  let np=0;
  if(PRICE&&PRICES&&Object.keys(PRICES).length){
    for(const [dk,p] of Object.entries(PRICES)){const v=rep.get(dk)??val(BASE,dk);if(v==null)continue;const fmt=n=>Number(n).toLocaleString("en-US");
      rep.set(dk,`Shop Price: ${p[0]===p[1]?"":"from "}${fmt(p[0])} aUEC${p[3]?" (some variants)":""} (UEX ${p[2]})\\n`+v.replace(PRICE_RE,""));np++}}
  else for(const [lk,[k,v]] of BASE.map)if(lk.startsWith("item_desc")&&PRICE_RE.test(v)){rep.set(lk,v.replace(PRICE_RE,""))}
  // optional credit line, appended after StarStrings' own login message (never replaces it)
  const lm=val(BASE,NOTE_KEY);
  if(NOTE&&lm!=null&&!lm.includes("Label Forge"))rep.set(NOTE_KEY,lm+"\\n\\n"+NOTE_TXT);
  const lines=BASE.text.split("\n");
  for(let i=0;i<lines.length;i++){const l=lines[i],j=l.indexOf("=");if(j<=0)continue;const k=l.slice(0,j).replace(/^﻿/,"").toLowerCase();
    if(rep.has(k)){const cr=l.endsWith("\r")?"\r":"";lines[i]=l.slice(0,j+1)+rep.get(k)+cr}}
  let out=lines.join("\n");if(!out.startsWith("﻿"))out="﻿"+out;
  const enc=new TextEncoder(),iniB=enc.encode(out);
  const howto="ShoGy-HR Label Forge - shogy-hr.com/labels\r\n\r\n1. Close Star Citizen.\r\n2. Unpack this zip into your ...\\StarCitizen\\LIVE folder\r\n   (it creates/updates data\\Localization\\english\\global.ini).\r\n3. In ...\\StarCitizen\\LIVE\\user.cfg you need the line:  g_language = english\r\n";
  const zip=makeZip([["data/Localization/english/global.ini",iniB],["Label Forge - INSTALL.txt",enc.encode(howto)]]);
  const dl=(blob,name)=>{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)};
  dl(new Blob([zip],{type:"application/zip"}),"global.ini-LabelForge.zip");
  $("#out").innerHTML=`<p class="ok">✓ ${t("done",nc,nv)}${np?" "+t("doneP",np):""} <span class="hint">(${esc(BASEN)})</span></p><p class="hint">${t("zipNote")} <a href="#" id="plainIni">${t("plainIni")}</a></p>`;
  $("#plainIni").onclick=e=>{e.preventDefault();dl(new Blob([iniB],{type:"text/plain;charset=utf-8"}),"global.ini")}};
/* minimal .zip writer (stored, no compression): browsers block bare .ini downloads less when zipped */
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function makeZip(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  const d=new Date(),dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1)),dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate());
  for(const [name,data] of files){const nb=enc.encode(name),crc=crc32(data),h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);
    h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nb.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nb,data);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);
    c.setUint16(12,dt,true);c.setUint16(14,dd,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nb.length,true);
    c.setUint32(42,off,true);cen.push(new Uint8Array(c.buffer),nb);off+=30+nb.length+data.length}
  const cs=cen.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)])}

function renderAll(){drawLegend();
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.getAttribute("data-t")));
  $("#vq").placeholder=t("vq");
  $("#flags").innerHTML=LANGS.map(l=>`<button type="button" data-l="${l}" class="${l===LANG?"on":""}" title="${NAMES[l]}" aria-label="${NAMES[l]}">${FLAGS[l]}</button>`).join("");
  drawTpl();drawVeh()}
$("#flags").addEventListener("click",ev=>{const b=ev.target.closest("button[data-l]");if(!b)return;LANG=b.getAttribute("data-l");try{localStorage.setItem("scbp-lang",LANG)}catch(e){}renderAll()});
try{const s=JSON.parse(localStorage.getItem(LSK)||"null");if(s){TPL=s.tpl||[];VEH=(s.veh||[]).map(v=>({...v,pre:(v.pre||"").replace(NUMS,"")}));if(s.note===false)NOTE=false;if(s.price===false)PRICE=false;if(s.num===false)AUTONUM=false}else TPL=PRESETS.ud.map(x=>({...x}))}catch(e){TPL=PRESETS.ud.map(x=>({...x}))}
renderAll();
$("#cNum").checked=AUTONUM;$("#cNum").onchange=e=>{AUTONUM=e.target.checked;save();drawVeh()};
$("#cPrice").checked=PRICE;$("#cPrice").onchange=e=>{PRICE=e.target.checked;save()};
$("#cNote").checked=NOTE;$("#cNote").onchange=e=>{NOTE=e.target.checked;save()};
fetch("../blueprints/data/components.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{COMP={};for(const [k,v] of Object.entries(d.items||{}))if(/^item_name/.test(k)&&!/_default$/.test(k))COMP[k]=v;COMPV=d.v||"";drawTpl()}).catch(()=>{});
