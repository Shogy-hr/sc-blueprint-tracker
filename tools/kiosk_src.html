<style>
:root{--ff:Rajdhani,"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;--tx:#d5ece8;--dim:#7fa7a2;--mut:#55807b;--line:#24504c;--line2:#1a3d3a;--pan:rgba(8,30,31,.72);--gold:#e2cf78;--goldbg:#a59646;--ok:#79e0b4;--bad:#ff8b7b;--want:#ffc46b;--amber:#ffb24a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:radial-gradient(ellipse at 50% 40%,#3a2418 0,#1b110c 55%,#0c0806 100%);color:var(--tx);font:500 15px/1.3 var(--ff);padding:14px}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx)}
.bezel{max-width:1560px;margin:0 auto;background:linear-gradient(160deg,#3b434a,#1d2226 40%,#2b3237);border-radius:42px;padding:20px;box-shadow:0 20px 60px #000c,inset 0 2px 0 #5d676f,inset 0 -3px 8px #0008}
.screen{position:relative;border-radius:20px;min-width:0;background:radial-gradient(ellipse at 78% 22%,#14423f 0,#0c2a29 45%,#081d1d 100%);box-shadow:inset 0 0 0 2px #0a1414,inset 0 0 40px #000a;display:grid;grid-template-columns:52px minmax(0,1fr);min-height:760px;overflow:hidden}
.rail{display:flex;flex-direction:column;justify-content:center;gap:16px;padding:0 0 0 6px}
.rail button{width:44px;height:120px;border:0;border-right:2px solid #3f6d68;background:linear-gradient(90deg,#16302f,#1d3c3a);color:#9cc9c3;display:grid;place-items:center;border-radius:4px 0 0 4px;position:relative}
.rail button.on{background:linear-gradient(90deg,#8c7f36,#b6a552);color:#fff6cc;border-right-color:var(--gold)}
.rail button.on:after{content:"";position:absolute;right:-9px;top:50%;margin-top:-6px;border:6px solid transparent;border-left-color:var(--gold)}
.rail svg{width:22px;height:22px}
.main{display:flex;flex-direction:column;min-width:0;padding:14px 18px 16px 12px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid #0a1716;padding-bottom:8px;margin-bottom:10px}
.ttl{font:700 26px/1 var(--ff);letter-spacing:.02em;color:#f1fbf9}
.ttl small{font-weight:500;color:#a9c9c5;font-size:24px}
.badge{font:700 12px var(--ff);letter-spacing:.08em;padding:4px 10px;border-radius:3px;text-transform:uppercase}
.badge.view{background:#0f3a37;border:1px solid #3d7d76;color:#9fe3d8}
.badge.sim{background:#3d2a0c;border:1px solid var(--amber);color:var(--amber)}
.top .sp{flex:1}
@media (min-width:761px){#vbadge{white-space:nowrap;flex:0 0 auto}}
.bmc{display:inline-flex;align-items:center;gap:7px;text-decoration:none;white-space:nowrap;color:#2a1a0c;background:linear-gradient(#ffd96b,#f2b33d);border:1px solid #ffe7a1;border-radius:20px;padding:4px 13px 4px 8px;font:700 14px/1 var(--ff);letter-spacing:.03em;box-shadow:0 0 0 0 rgba(255,205,90,.55);animation:bmcGlow 3.2s ease-in-out infinite;transition:transform .15s,filter .15s}
.bmc:hover,.bmc:focus-visible{transform:translateY(-1px) scale(1.04);filter:brightness(1.08);outline:none}
.bmc .cup{width:22px;height:22px;color:#4a2a12;overflow:visible;transform-origin:50% 90%;animation:bmcTilt 3.2s ease-in-out infinite}
.bmc .cup .mug{color:#5b3416}

wWhereCloud:["Your profile is saved in <b>your own Claude account</b> – private, only you can see it.","Tvoj profil se sprema u <b>tvoj Claude račun</b> – privatno, vidiš ga samo ti.","Dein Profil wird in <b>deinem Claude-Konto</b> gespeichert – privat, nur für dich sichtbar.","Profil zapisuje się na <b>twoim koncie Claude</b> – prywatnie, widzisz go tylko ty.","Ton profil est enregistré dans <b>ton propre compte Claude</b> – privé, visible par toi seul.","Tu perfil se guarda en <b>tu propia cuenta de Claude</b>: privado, solo tú lo ves."],
wBackup:["<b>Save a backup regularly:</b> ⚙ SETTINGS → Download backup. You can load it on any device.","<b>Redovito spremi kopiju:</b> ⚙ POSTAVKE → Preuzmi kopiju. Možeš je učitati na bilo kojem uređaju.","<b>Regelmäßig sichern:</b> ⚙ EINSTELLUNGEN → Sicherung herunterladen. Auf jedem Gerät ladbar.","<b>Regularnie zapisuj kopię:</b> ⚙ USTAWIENIA → Pobierz kopię. Wczytasz ją na każdym urządzeniu.","<b>Sauvegarde régulièrement :</b> ⚙ PARAMÈTRES → Télécharger la sauvegarde. Rechargeable sur n’importe quel appareil.","<b>Guarda una copia a menudo:</b> ⚙ AJUSTES → Descargar copia. Puedes cargarla en cualquier dispositivo."],
wUpdates:["<b>Game updates:</b> when CIG changes recipes or adds new blueprints (and later ships and more), we update the game data here. Your profile is recognised and updated automatically – you won’t lose anything.","<b>Promjene u igri:</b> kad CIG promijeni recepte ili doda nove blueprinte (a kasnije i brodove i ostalo), mi ovdje ažuriramo podatke igre. Tvoj profil se prepozna i automatski ažurira – ništa ne gubiš.","<b>Spiel-Updates:</b> Ändert CIG Rezepte oder fügt neue Blueprints hinzu (später auch Schiffe usw.), aktualisieren wir hier die Spieldaten. Dein Profil wird erkannt und automatisch angepasst – nichts geht verloren.","<b>Aktualizacje gry:</b> gdy CIG zmieni receptury lub doda blueprinty (później statki i więcej), aktualizujemy tu dane gry. Profil zostanie rozpoznany i zaktualizowany automatycznie – nic nie stracisz.","<b>Mises à jour du jeu :</b> quand CIG modifie des recettes ou ajoute des blueprints (plus tard des vaisseaux, etc.), nous mettons à jour les données ici. Ton profil est reconnu et mis à jour automatiquement – tu ne perds rien.","<b>Actualizaciones del juego:</b> cuando CIG cambie recetas o añada blueprints (y más adelante naves y demás), actualizamos aquí los datos. Tu perfil se reconoce y se actualiza solo: no pierdes nada."],
wFan:["Unofficial fan tool, not affiliated with Cloud Imperium Games. It never touches the game.","Neslužbeni alat zajednice, nije povezan s Cloud Imperium Games. Nikad ne dira igru.","Inoffizielles Fan-Tool, nicht mit Cloud Imperium Games verbunden. Greift nie ins Spiel ein.","Nieoficjalne narzędzie fanów, niezwiązane z Cloud Imperium Games. Nigdy nie ingeruje w grę.","Outil de fan non officiel, sans lien avec Cloud Imperium Games. Ne touche jamais au jeu.","Herramienta no oficial de fans, sin relación con Cloud Imperium Games. Nunca toca el juego."],

wIntro:["Create your own profile. Your blueprints, notes and stock are yours only – nobody else who opens this link sees or changes them. Afterwards use ⟳ GAME.LOG to load the blueprints you already have.","Napravi svoj profil. Tvoji blueprinti, bilješke i zalihe su samo tvoji – nitko drugi tko otvori ovaj link ih ne vidi niti mijenja. Zatim preko ⟳ GAME.LOG učitaj blueprinte koje već imaš.","Erstelle dein eigenes Profil. Deine Blueprints, Notizen und Vorräte gehören nur dir – niemand sonst mit diesem Link sieht oder ändert sie. Danach mit ⟳ GAME.LOG deine vorhandenen Blueprints laden.","Utwórz własny profil. Twoje blueprinty, notatki i zapasy są tylko twoje – nikt inny z tym linkiem ich nie widzi ani nie zmienia. Potem przez ⟳ GAME.LOG wczytaj posiadane blueprinty.","Crée ton propre profil. Tes blueprints, notes et stocks n’appartiennent qu’à toi – personne d’autre avec ce lien ne les voit ni ne les modifie. Ensuite, charge tes blueprints via ⟳ GAME.LOG.","Crea tu propio perfil. Tus blueprints, notas e inventario son solo tuyos: nadie más con este enlace los ve ni los cambia. Después carga tus blueprints con ⟳ GAME.LOG."],

logIntro:["Star Citizen writes every blueprint you receive to Game.log (“Received Blueprint”). This only reads that text file – the game itself is not touched.","Star Citizen svaki dobiveni blueprint zapiše u Game.log („Received Blueprint”). Ovdje se samo čita taj tekst, igra se ne dira.","Star Citizen schreibt jeden erhaltenen Blueprint in die Game.log („Received Blueprint“). Hier wird nur diese Textdatei gelesen – das Spiel selbst wird nicht angefasst.","Star Citizen zapisuje każdy otrzymany blueprint w Game.log („Received Blueprint”). Tu odczytywany jest tylko ten plik tekstowy – gra nie jest modyfikowana.","Star Citizen inscrit chaque blueprint reçu dans Game.log (« Received Blueprint »). Seul ce fichier texte est lu – le jeu n’est pas modifié.","Star Citizen escribe cada blueprint recibido en Game.log («Received Blueprint»). Aquí solo se lee ese archivo de texto; el juego no se toca."],

dirNote:["Your browser may ask whether to “upload” the files – they never leave your computer, they are only read on this page.","Preglednik će možda pitati želiš li „uploadati” datoteke – one ne napuštaju tvoje računalo, samo se čitaju na ovoj stranici.","Dein Browser fragt evtl., ob die Dateien „hochgeladen“ werden sollen – sie verlassen deinen Computer nie, sie werden nur auf dieser Seite gelesen.","Przeglądarka może zapytać o „przesłanie” plików – nie opuszczają one komputera, są tylko odczytywane na tej stronie.","Ton navigateur peut demander s’il faut « importer » les fichiers – ils ne quittent jamais ton ordinateur, ils sont seulement lus sur cette page.","Tu navegador puede preguntar si quieres «subir» los archivos: nunca salen de tu ordenador, solo se leen en esta página."],

manualS:["1. Close this window and find the blueprint in the list (you can search by name).<br>2. Click it to open its details.<br>3. Click <b>{0}</b>. Clicking again removes the mark.","1. Zatvori ovaj prozor i pronađi blueprint na popisu (možeš ga potražiti po imenu).<br>2. Klikni na njega da se otvore detalji.<br>3. Klikni <b>{0}</b>. Ponovni klik uklanja oznaku.","1. Schließe dieses Fenster und suche den Blueprint in der Liste (Suche nach Name geht).<br>2. Klicke ihn an, um die Details zu öffnen.<br>3. Klicke auf <b>{0}</b>. Ein weiterer Klick entfernt die Markierung.","1. Zamknij to okno i znajdź blueprint na liście (możesz wyszukać po nazwie).<br>2. Kliknij go, aby otworzyć szczegóły.<br>3. Kliknij <b>{0}</b>. Ponowne kliknięcie usuwa oznaczenie.","1. Ferme cette fenêtre et trouve le blueprint dans la liste (la recherche par nom fonctionne).<br>2. Clique dessus pour ouvrir les détails.<br>3. Clique sur <b>{0}</b>. Un nouveau clic retire la marque.","1. Cierra esta ventana y busca el blueprint en la lista (puedes buscar por nombre).<br>2. Haz clic en él para abrir los detalles.<br>3. Haz clic en <b>{0}</b>. Otro clic quita la marca."],

matNote:["Enter how much of each material you have and its quality (0–1000). The tracker then knows what you can craft (“Hide Unaffordable”). Click a material name to see the blueprints that use it.","Upiši koliko čega imaš i koje kvalitete (0–1000). Tracker onda zna što možeš izraditi („Sakrij neizradive”). Klik na ime materijala prikazuje blueprinte koji ga koriste.","Trage ein, wie viel du von jedem Material hast und in welcher Qualität (0–1000). Dann weiß der Tracker, was du herstellen kannst („Nicht herstellbare ausblenden“). Klick auf einen Materialnamen zeigt die Blueprints, die es nutzen.","Wpisz, ile masz każdego materiału i jakiej jakości (0–1000). Tracker będzie wiedział, co możesz wytworzyć („Ukryj niedostępne”). Kliknij nazwę materiału, aby zobaczyć blueprinty, które go używają.","Indique la quantité et la qualité (0–1000) de chaque matériau. Le tracker saura alors ce que tu peux fabriquer (« Masquer les non réalisables »). Clique sur un matériau pour voir les blueprints qui l’utilisent.","Introduce cuánto tienes de cada material y su calidad (0–1000). Así el tracker sabe qué puedes fabricar («Ocultar no fabricables»). Haz clic en un material para ver los blueprints que lo usan."],

statsHint:["Base = no quality effect (×1.00). Enhanced is an estimate from the material quality in the slots (when one stat is affected by several slots, the average is used). Base weapon values (e.g. RPM) are not in the recipe data.","Osnova = bez utjecaja kvalitete (×1.00). Poboljšano je procjena iz kvalitete materijala u slotovima (kad isti stat utječe više slotova, uzima se prosjek). Osnovne vrijednosti oružja (npr. RPM) nisu u podacima recepata.","Basis = ohne Qualitätseinfluss (×1,00). Verbessert ist eine Schätzung aus der Materialqualität (wirken mehrere Slots auf denselben Wert, wird gemittelt). Grundwerte von Waffen (z. B. RPM) fehlen in den Rezeptdaten.","Bazowa = bez wpływu jakości (×1,00). Ulepszona to szacunek na podstawie jakości materiałów (gdy kilka slotów wpływa na tę samą statystykę, liczona jest średnia). Podstawowe wartości broni (np. RPM) nie występują w danych receptur.","Base = sans effet de qualité (×1,00). Amélioré est une estimation selon la qualité des matériaux (si plusieurs emplacements affectent la même stat, on fait la moyenne). Les valeurs de base des armes (ex. RPM) ne figurent pas dans les recettes.","Base = sin efecto de calidad (×1,00). Mejorado es una estimación según la calidad de los materiales (si varias ranuras afectan a la misma estadística, se promedia). Los valores base de las armas (p. ej. RPM) no están en los datos de recetas."],

function drawFlags(){$$(".lflags").forEach(fb=>{fb.innerHTML=LANGS.map(l=>`<button type="button" data-l="${l[0]}" class="${l[0]===LANG?"on":""}" title="${l[1]}" aria-label="${l[1]}">${FLAGS[l[0]]}</button>`).join("");fb.title=T("sGameTerms")});$$(".lflags button").forEach(b=>b.onclick=()=>setLang(b.dataset.l))}
function applyStatic(){
  document.documentElement.lang=LANG;
  $$("[data-l10n]").forEach(e=>e.innerHTML=T(e.dataset.l10n));
  $$("[data-it]").forEach(e=>{e.title=T(e.dataset.it);e.setAttribute("aria-label",T(e.dataset.it))});
  $$("[data-ip]").forEach(e=>e.placeholder=T(e.dataset.ip));
  drawFlags();
  
  $("#bSet").innerHTML=`⚙ ${T("settings")}`;
  const bp=$("#bProf");bp.textContent="👤 "+(activeName()||"—");bp.title=T("sProf");
  const sc=$("#bStat"),stt=stState(),dv=bnum(CAT.v);sc.className="tbtn stat "+(stt==="ok"?"ok":stt==="sync"?"sync":"");
  sc.innerHTML=`<i></i>${esc(dv?dv.ver:CAT.v)}${PTUON&&PTU?" + PTU":""}`;sc.title=stt==="ok"?T("chipOk"):stt==="sync"?T("chipSync"):T("chipUnk");
  const warn=MODE==="local"&&PM.active&&Object.keys(ST.owned).length>0&&Date.now()-(ST.lastBackup||0)>14*864e5;
  $("#bSet").classList.toggle("warn",!!warn);$("#bSet").title=warn?T("bkWarn"):"";
}
function setLang(l){if(!LANGS.some(x=>x[0]===l))return;LANG=l;try{localStorage.setItem("scbp-lang",l)}catch(e){}if(ST.lang!==l){ST.lang=l;save()}applyStatic();render();if($("#mWel").classList.contains("on"))renderWel()}

function modVal(entries,q){ // entries for one mod idx in one group
  let lin=null,add=null;
  for(const e of entries){
    if(e[1]==="a"){for(const sg of e[2]){if(q>=sg[0]&&q<=sg[1]){const f=sg[1]>sg[0]?(q-sg[0])/(sg[1]-sg[0]):0;add=Math.round(sg[2]+(sg[3]-sg[2])*f)}}}
    else if(q>=e[1]&&q<=e[2]){const f=e[2]>e[1]?(q-e[1])/(e[2]-e[1]):0;lin={v:e[3]+(e[4]-e[3])*f,dir:Math.sign(e[4]-e[3])}}
  }

function calcStats(it){
  const rows=new Map();

    const by=new Map();g[3].forEach(m=>{if(!by.has(m[0]))by.set(m[0],[]);by.get(m[0]).push(m)});
    const f=U.fill[gi];
    by.forEach((ents,mi)=>{
      if(!rows.has(mi))rows.set(mi,{sum:0,cnt:0,add:0,dir:0,isAdd:ents[0][1]==="a",touched:false});
      const r=rows.get(mi);
      const lin=ents.find(e=>e[1]!=="a");if(lin&&!r.dir)r.dir=Math.sign(lin[4]-lin[3]);
      if(lin)r.cnt++;

      const v=modVal(ents,f.q);r.touched=true;
      if(lin)r.sum+=v.lin?v.lin.v:1;if(v.add!=null)r.add+=v.add;

const LIM={q:4,p:2};
function lane(qk,pk,now,onDone){
  const S=ST.sim;let ch=false;
  for(let guard=0;guard<200;guard++){
    const P=S[pk];
    if(P.length){let ei=0,e=Infinity;P.forEach((j,i)=>{const t=j.start+j.dur*1000;if(t<e){e=t;ei=i}});
      if(e<=now){const j=P.splice(ei,1)[0];onDone(j,e);if(S[qk].length){const n=S[qk].shift();n.start=e;P.push(n)}ch=true;continue}}
    if(P.length<LIM.p&&S[qk].length){const n=S[qk].shift();n.start=now;P.push(n);ch=true;continue}
    break;
  }
  return ch;
}
function advance(now){
  const a=lane("q","p",now,(j,t)=>{ST.sim.disp.unshift({id:j.id,k:"f",n:j.n,qty:j.qty,loc:j.loc,t});for(let i=0;i<j.qty;i++)ST.sim.inv.push({id:ST.sim.seq++,n:j.n})});
  const b=lane("dq","dp",now,(j,t)=>{const tot={};j.items.forEach(x=>{const it=BYN.get(x.toLowerCase());if(it)it.x.forEach(r=>{tot[r[0]]=(tot[r[0]]||0)+r[1]})});
    for(const m in tot){const s=ST.stock[m]||{a:0,q:500};s.a=Math.round((+s.a+tot[m])*1000)/1000;ST.stock[m]=s}
    ST.sim.disp.unshift({id:j.id,k:"d",n:"",items:j.items,ret:tot,loc:j.loc,t})});
  if(ST.sim.disp.length>60)ST.sim.disp.length=60;
  return a||b;
}

async function walkEntry(en,out){
  if(en.isFile){const f=await new Promise((ok,no)=>en.file(ok,no)).catch(()=>null);if(f)out.push(f);return}
  if(en.isDirectory){const r=en.createReader();for(;;){const b=await new Promise((ok,no)=>r.readEntries(ok,no)).catch(()=>[]);if(!b.length)break;for(const c of b)await walkEntry(c,out)}}}

  const files=Array.from(e.dataTransfer.files),ents=Array.from(e.dataTransfer.items||[]).map(i=>i.webkitGetAsEntry?i.webkitGetAsEntry():null).filter(Boolean);
  if(ents.some(x=>x.isDirectory)){const out=[];for(const en of ents)await walkEntry(en,out);readLogs(out,false)}else readLogs(files,true)};
const BP_RE=/<([^>]+)>[^\n]*?Received Blueprint:\s*(.*?):\s*"/g;
/* stream a (possibly huge) log: keep the first 256 KB for the header, collect only "Received Blueprint" lines */
async function scanLog(f){
  const head=await f.slice(0,262144).text();const bp=[];
  const rd=f.stream().getReader(),dec=new TextDecoder();let carry="";
  for(;;){const {value,done}=await rd.read();const txt=carry+(done?dec.decode():dec.decode(value,{stream:true}));
    const cut=done?txt.length:txt.lastIndexOf("\n")+1;const part=txt.slice(0,cut);carry=txt.slice(cut);
    if(part.includes("Received Blueprint"))for(const m of part.matchAll(BP_RE))bp.push(m);
    if(done)break}
  const h=/Handle\[([^\]\s]+)\]/.exec(head)||/AccountLoginCharacterStatus_Character>[^\n]*? - name (\S+) - state/.exec(head);
  return {head,bp,acct:h?h[1]:""}}
async function readLogs(all,explicit){
  if(!all||!all.length)return;const res=$("#logres");
  const files=explicit?all:all.filter(f=>/\.log$/i.test(f.name));
  const manual=`<b>${T("manualT")}</b><p>${T("manualS",T("markOwn"))}</p>`;
  const fail=(msg,extra="")=>{res.innerHTML=`<div class="rbox bad"><h4>✕ ${T("failTitle")}</h4><p>${msg}</p>${extra}<div class="man">${manual}</div></div>`};
  if(!files.length){fail(T("noLogs"));return}
  res.innerHTML=`<div class="scan"><div class="scr"><i></i></div><div><b>${T("scanTitle")}</b><div class="bar"><span id="scBar"></span></div><div class="hint" id="scTxt"></div></div></div>`;
  const bar=$("#scBar"),txt=$("#scTxt"),t0=Date.now();
  const accs=new Map();let game=null,nread=0,fi=0,lastUi=0,nbp=0;   // account handle -> {files, found}; "" = log without account info
  const ui=()=>{bar.style.width=(100*fi/files.length).toFixed(1)+"%";txt.textContent=T("scanProg",fi,files.length,nbp)};ui();
  for(const f of files){fi++;
    if(Date.now()-lastUi>120){lastUi=Date.now();ui()}
    let t;try{t=await scanLog(f)}catch(e){continue}nread++;
    const cl=/Changelist:\s*(\d+)/.exec(t.head),br=/Branch:\s*sc-alpha-([\d.]+)/.exec(t.head),env=/@env_session:\s*'[a-z]+-sc-alpha-[\d]+-(\d+)'/.exec(t.head),ex=/Executable:[^\n]*\\(LIVE|PTU|EPTU|HOTFIX|TECH-PREVIEW)\\Bin64/i.exec(t.head),ls=/Log started on ([^\n]+)/.exec(t.head);
    if(cl){const g={build:+cl[1],ver:br?br[1]:"",env:env?+env[1]:0,ch:ex?ex[1].toUpperCase():"LIVE",at:ls?Date.parse(ls[1])||0:0};if(!game||g.at>game.at||(!g.at&&g.build>game.build))game=g}
    let a=accs.get(t.acct);if(!a){a={files:0,found:new Map()};accs.set(t.acct,a)}a.files++;
    for(const m of t.bp){const name=m[2].replace(/^[A-Z]{4} -[A-Z]{3} -\d-[A-Z] -/,"").trim();if(!name)continue;const ts=Date.parse(m[1])||Date.now();const k=name.toLowerCase(),o=a.found.get(k);if(!o){nbp++;a.found.set(k,{name,ts})}else if(ts<o.ts)o.ts=ts}}
  ui();await new Promise(r=>setTimeout(r,Math.max(0,1400-(Date.now()-t0))));   // let the scan be seen even for one small file
  const errs=files.length-nread;
  const gl=`<p class="hint">${T("filesRead",nread)}${errs?" · "+T("readErr",errs):""}</p>`+(game?`<p class="hint">${T("logGame",esc(game.ver),esc(game.ch),game.build)} – ${game.ch!=="LIVE"?T("stYourPtu"):(game.env||game.build)<=((bnum(CAT.v)||{}).build||0)?T("stYourOk"):T("stYourNewer")}</p>`:"");
  if(game){ST.game=game;save();applyStatic()}
  if(!nread){fail(T("readErr",errs));return}
  const merge=keys=>{const f=new Map();for(const k of keys)for(const [n,v] of (accs.get(k)||{found:new Map()}).found){const o=f.get(n);if(!o||v.ts<o.ts)f.set(n,v)}return f};
  const named=[...accs.keys()].filter(k=>k).sort((x,y)=>accs.get(y).files-accs.get(x).files);
  const finish=(keys)=>{
    const found=merge(keys);const who=keys.filter(k=>k);
    if(!found.size){fail(T("noBp"),gl);return}
    if(who.length===1)ST.logAcct=who[0];
    const r=addLogNames(found);ST.logSync=Date.now();save();render();
    res.innerHTML=`<div class="rbox"><h4>✓ ${T("okTitle")}</h4>${who.length?`<p class="hint">${T("accOne",who.map(esc).join(", "))}</p>`:""}${T("found",r.added+r.already,r.added,r.already)}`+(r.newly.length?`<ul>${r.newly.sort().map(n=>"<li>"+esc(n)+"</li>").join("")}</ul>`:"")+(r.unknown.length?`<p class="hint">${T("notInCat",r.unknown.map(esc).join(", "))}</p>`:"")+gl+`<details class="man"><summary>${T("manualMiss")}</summary>${manual}</details></div>`};
  if(named.length<=1){finish([...accs.keys()]);return}
  /* logs from several game accounts: let the player choose which belong to this profile */
  const pre=named.includes(ST.logAcct)?ST.logAcct:named[0];
  const row=(k,lbl)=>{const a=accs.get(k);return `<label class="accrow"><input type="checkbox" value="${esc(k)}" ${k===pre?"checked":""}> <span>${lbl}</span></label>`};
  res.innerHTML=`<div class="rbox acc"><h4>${T("accT")}</h4><p>${T("accS")}</p>`+named.map(k=>row(k,T("accRow",esc(k),accs.get(k).found.size,accs.get(k).files))).join("")+(accs.has("")?row("",T("accNone",accs.get("").found.size,accs.get("").files)):"")+`<p class="hint" id="accErr"></p><button class="btn pri" id="accGo">${T("accGo")}</button>${gl}</div>`;
  $("#accGo").onclick=()=>{const keys=[...res.querySelectorAll(".accrow input:checked")].map(x=>x.value);if(!keys.length){$("#accErr").textContent=T("accPick");return}finish(keys)};
}

function jobRow(j,prog,kind){

  if(prog){const rem=(j.start+j.dur*1000-now)/1000;pct=Math.min(100,Math.max(0,100-rem/j.dur*100));tm=fmtT(rem);status=T("inProg")}
  else{tm=fmtT(j.dur);status=T("waiting")}
  return `<tr data-id="${j.id}"><td>${name}${prog?`<div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>`:""}</td><td class="hint">${info}</td><td>T1</td><td>${status}</td><td class="tm" data-end="${prog?j.start+j.dur*1000:""}">${tm}</td><td>${esc(LOCN(j.loc))}</td><td><button class="x" data-c="${kind}${prog?"p":"q"}" data-id="${j.id}" title="${T("cancel")}">✕</button></td></tr>`;

  let body="";
  if(U.qt==="wo")body=`<div class="qhead">${T("furT")}</div>`+qTable(T("queueT"),S.q,LIM.q,false,"f",T("noQueued"))+qTable(T("inProgT"),S.p,LIM.p,true,"f",T("noActive"));
  else if(U.qt==="ds")body=`<div class="qhead">${T("disBtn")}</div>`+qTable(T("queueT"),S.dq,LIM.q,false,"d",T("noQueued"))+qTable(T("inProgT"),S.dp,LIM.p,true,"d",T("noActive"));
  else body=`<div class="qhead">${T("dispT")}</div><div class="qsec">${S.disp.length?`<table class="q"><tr><th>${T("thItem")}</th><th>${T("resultH")}</th><th>${T("doneH")}</th><th>${T("thLoc")}</th></tr>${S.disp.map(d=>`<tr><td>${d.k==="f"?esc(d.n)+(d.qty>1?" ×"+d.qty:""):T("disP")+": "+esc(d.items?(d.items.length===1?d.items[0]:T("items",d.items.length)):d.n)}</td><td class="hint">${d.k==="f"?T("inSimInv"):Object.entries(d.ret||{}).map(([m,a])=>esc(m)+" "+(Math.round(a*1000)/1000)).join(", ")}</td><td>${new Date(d.t).toLocaleTimeString(LOC(),{hour:"2-digit",minute:"2-digit"})}</td><td>${esc(LOCN(d.loc))}</td></tr>`).join("")}</table><div class="mbtns" style="padding:0 10px 10px"><button class="btn" id="clrD">${T("clearList")}</button></div>`:`<div class="qempty"><span>${T("noDisp")}</span></div>`}</div>`;
  const lanes=U.qt==="wo"?[["q","p"]]:U.qt==="ds"?[["dq","dp"]]:[["q","p"],["dq","dp"]];
  const pend=lanes.reduce((a,[x,y])=>a+S[x].length+S[y].length,0);
  v.innerHTML=`<div class="qv"><div class="simnote">${T("qNote")}</div>${tabs}${body}
    <div class="foot" style="border-top:1px solid var(--line2)"><div class="grow"></div><button class="instant" id="inst" ${pend?"":"disabled"}>${T("instF")}<small>${U.qt==="dp"?T("instAll",pend):T("instThis",pend)}</small></button></div></div>`;
  $("#inst").onclick=()=>instant(lanes);
  $$(".qtabs button").forEach(b=>b.onclick=()=>{U.qt=b.dataset.t;renderQueue()});
  $$("table.q .x").forEach(b=>b.onclick=()=>{const k=b.dataset.c,id=+b.dataset.id;const map={fq:"q",fp:"p",dq:"dq",dp:"dp"};const arr=ST.sim[map[k]];const i=arr.findIndex(j=>j.id===id);if(i>=0)arr.splice(i,1);advance(Date.now());save();renderQueue()});
  if($("#clrD"))$("#clrD").onclick=()=>{ST.sim.disp=[];save();renderQueue()};
}
function renderQueueTimes(){const now=Date.now();$$("td.tm[data-end]").forEach(td=>{const end=+td.dataset.end;if(!end)return;td.textContent=fmtT((end-now)/1000)});
  $$("table.q tr[data-id]").forEach(tr=>{const td=tr.querySelector("td.tm");const end=+td.dataset.end;if(!end)return;const id=+tr.dataset.id;const j=ST.sim.p.find(x=>x.id===id)||ST.sim.dp.find(x=>x.id===id);if(j){const i=tr.querySelector(".bar i");if(i)i.style.width=Math.min(100,(now-j.start)/(j.dur*10)).toFixed(1)+"%"}})}

applyStatic();render();
try{if(window.claude){const h=document.getElementById("home");if(h)h.remove()}}catch(e){}
try{if(!window.claude&&"serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
boot().then(()=>{applyStatic();advance(Date.now());render();if(!PM.list.length)showWelcome(false);loadStatus()});
})();
</script>
</body>
