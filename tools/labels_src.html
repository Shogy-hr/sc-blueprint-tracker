/*BASECSS*/
main{padding:20px 0;display:block}
.hello{text-align:center;margin:0 0 18px}

.drop:hover,.drop.hov{background:#123634;color:#fff}
.btn{font:700 15px var(--ff);letter-spacing:.06em;text-transform:uppercase;border:1px solid #2f6b65;background:#133a37;color:#e7f6f3;padding:8px 14px;border-radius:4px;cursor:pointer}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.ok{color:var(--ok)}.warn{color:#ffb24a}.err{color:#ff8c7a}
/* template editor */
.tpl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px;background:#081d1d;border:1px solid #1d4440;border-radius:5px;min-height:52px}
.tok{display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 8px;border-radius:4px;background:#173f3c;border:1px solid #2f6b65;font:600 15px var(--ff)}
.tok.lit{background:#2a2a1c;border-color:#6b6232}
.tok select,.tok input{font:600 15px var(--ff);background:#0b2424;color:#e7f6f3;border:1px solid #2f6b65;border-radius:3px;padding:2px 4px}
.tok input{width:4.2em}
.tok button{background:none;border:0;color:#9cc3bd;cursor:pointer;font-size:15px;padding:0 4px}.tok button:hover{color:#fff}
.addt{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.addt .btn{font-size:13px;padding:5px 9px}
.prev{margin-top:10px;display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:15px}

.vt{width:100%;border-collapse:collapse;font-size:15px}
.vt td{padding:5px 6px;border-bottom:1px solid #1b3a37;vertical-align:middle}
.vt input{font:600 15px var(--ff);background:#081d1d;color:#e7f6f3;border:1px solid #2f6b65;border-radius:3px;padding:3px 6px;width:6em}
.vt .nm{color:#f1fbf9}.vt .res{color:var(--dim);font-family:ui-monospace,Consolas,monospace;font-size:13px}
.vt button{background:#133a37;border:1px solid #2f6b65;color:#cfe;border-radius:3px;cursor:pointer;padding:1px 7px}
.vsearch{position:relative}.vsearch input{font:600 15px var(--ff);background:#081d1d;color:#e7f6f3;border:1px solid #2f6b65;border-radius:4px;padding:7px 10px;width:min(420px,100%)}

const t=(k,...a)=>{const r=TX[k];let s=r?(r[LANGS.indexOf(LANG)]||r[0]):k;a.forEach((v,i)=>{s=s.split("{"+i+"}").join(v)});return s};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------------- data ---------------- */
const TYPES={COOL:["COOL","Cooler","Cool","C"],POWR:["POWR","Power Plant","Powr","P"],SHLD:["SHLD","Shield Generator","Shld","S"],QDRV:["QDRV","Quantum Drive","Qdrv","Q"],RADR:["RADR","Radar","Radr","R"]};
const CLASSES={MIL:["MIL","Military","Mil","M"],CIV:["CIV","Civilian","Civ","C"],IND:["IND","Industrial","Ind","I"],STL:["STL","Stealth","Sth","S"],CMP:["CMP","Competition","Cmp","X"]};
const STYLE={code:0,long:1,short:2,letter:3};
const SSTAG=/^(Mil|Civ|Ind|Sth|Stl|Cmp)\/(\d+|-)?\/([A-Z\-])? /;
const CLSWORD={military:"MIL",civilian:"CIV",industrial:"IND",stealth:"STL",competition:"CMP"};
const SSCLS={Mil:"MIL",Civ:"CIV",Ind:"IND",Sth:"STL",Stl:"STL",Cmp:"CMP"};
let COMP={},COMPV="";         // lower-case loc key -> [type,size,grade]
let OLD=null,BASE=null,BASEN="";   // {map:Map(lowerKey->[key,value]), text}
let TPL=[],VEH=[],NOTE=true;
const NOTE_KEY="ui_pregame_persistentuniverse_desc",NOTE_TXT="Component labels & ship names: ShoGy-HR Label Forge - shogy-hr.com/labels";            // template tokens; [{k:key,pre,suf}]
const LSK="scbp-labels-v1";

function parseIni(text){const map=new Map();let n=0;
  for(const line of text.split(/\r?\n/)){const i=line.indexOf("=");if(i<=0)continue;const k=line.slice(0,i).replace(/^﻿/,"");map.set(k.toLowerCase(),[k,line.slice(i+1)]);n++}
  return {map,text,n}}
const val=(ini,k)=>{const e=ini&&ini.map.get(k.toLowerCase());return e?e[1]:null};
function plainName(v){return String(v||"").replace(SSTAG,"")}
/* the facts for one component, taken from the game data + a base/user file */
const KEYTYPE=[["COOL","COOL"],["POWR","POWR"],["SHLD","SHLD"],["QDRV","QDRV"],["QRDV","QDRV"],["RADR","RADR"]];
const DESCTYPE={"cooler":"COOL","power plant":"POWR","shield generator":"SHLD","quantum drive":"QDRV","radar":"RADR"};
function keyType(k,ini){const d=val(ini,"item_Desc"+k.slice(9))||"";const m=/Item Type:\s*([^\\\n]+)/.exec(d);
  if(m)return DESCTYPE[m[1].trim().toLowerCase()]||null;const u=k.toUpperCase();for(const [a,b] of KEYTYPE)if(u.includes(a))return b;return null}
/* the facts for one component: game data first, otherwise the StarStrings tag in the file */
function item(k,ini){
  const v=val(ini,k);if(v==null)return null;const m=SSTAG.exec(v);
  let c=COMP[k];
  if(!c){if(!m||!/^item_name/.test(k))return null;const ty=keyType(k,ini);if(!ty)return null;c=[ty,m[2]&&m[2]!=="-"?m[2]:"",m[3]&&m[3]!=="-"?m[3]:""]}
  let cls=m?SSCLS[m[1]]||"":"";
  if(!cls){const d=val(ini,"item_Desc"+k.slice(9))||"";const cm=/Class:\s*([A-Za-z]+)/.exec(d);if(cm)cls=CLSWORD[cm[1].toLowerCase()]||""}
  return {type:c[0],size:c[1]==null?"":String(c[1]),grade:c[2]||"",cls,name:plainName(v)}}
function compKeys(ini){const ks=new Set(Object.keys(COMP).filter(k=>ini.map.has(k)));
  for(const [lk,[k,v]] of ini.map)if(lk.startsWith("item_name")&&SSTAG.test(v)&&keyType(lk,ini))ks.add(lk);return [...ks]}
function tokVal(tk,it){
  switch(tk.k){case"lit":return tk.v;case"name":return it.name;case"size":return it.size;case"grade":return it.grade;
    case"type":return (TYPES[it.type]||[""])[STYLE[tk.s]]||"";case"class":return it.cls?(CLASSES[it.cls]||[""])[STYLE[tk.s]]||"":""}}
/* an empty field (e.g. unknown class) takes the separator after it along, so no "COOL - -4-A" */
const render=(tpl,it)=>{let o="",skip=false;for(const tk of tpl){const v=tokVal(tk,it);if(tk.k==="lit"){if(!skip)o+=v;skip=false;continue}skip=!v&&tk.k!=="name";o+=v}return o};
const isOff=tpl=>tpl.length===1&&tpl[0].k==="name"||!tpl.length;

/* ---------------- detection ---------------- */
const reEsc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
/* every way the label u can be built from this component's facts; the name is "the rest" */
function parses(u,it,cap=400){
  const opts=[];
  for(const s in STYLE){const tv=(TYPES[it.type]||[])[STYLE[s]];if(tv)opts.push({k:"type",s,v:tv});if(it.cls){const cv=CLASSES[it.cls][STYLE[s]];opts.push({k:"class",s,v:cv})}}
  if(it.size)opts.push({k:"size",v:it.size});if(it.grade)opts.push({k:"grade",v:it.grade});
  const out=[];
  (function go(i,acc,used){if(out.length>=cap)return;if(i===u.length){if(used.has("name"))out.push(acc);return}
    for(const o of opts){if(u.startsWith(o.v,i)&&!used.has(o.k)){const n=new Set(used);n.add(o.k);go(i+o.v.length,acc.concat([{k:o.k,s:o.s}]),n)}}
    if(!used.has("name")&&/[A-Za-z0-9]/.test(u[i]))for(let j=u.length;j>i+1;j--){const n=new Set(used);n.add("name");go(j,acc.concat([{k:"name"}]),n);if(out.length>=cap)return}
    if(/[A-Za-z0-9]/.test(u[i]))return;   // separators only: letters/digits belong to a field or the name
    const last=acc[acc.length-1];
    go(i+1,last&&last.k==="lit"?acc.slice(0,-1).concat([{k:"lit",v:last.v+u[i]}]):acc.concat([{k:"lit",v:u[i]}]),used)})(0,[],new Set());
  return out}
/* does label u fit template p for this component (name = anything)? */
function fits(p,it,u){const r="^"+p.map(tk=>tk.k==="name"?"(.+?)":reEsc(tokVal(tk,it))).join("")+"$";let m=null;try{m=new RegExp(r).exec(u)}catch(e){}return m?1-(m[1]||"").length/u.length:-1}
function detect(){
  const items=Object.keys(COMP).filter(k=>OLD.map.has(k)).map(k=>[k,item(k,OLD)]).filter(x=>x[1]);
  const cands=new Map();
  for(const [k,it] of items.slice(0,40)){for(const p of parses(val(OLD,k),it)){if(p.filter(x=>x.k!=="lit"&&x.k!=="name").length<1)continue;cands.set(JSON.stringify(p),p)}}
  let best=null,bs=-1,hits=0;
  for(const p of cands.values()){let sc=0,ex=0;for(const [k,it] of items){const f=fits(p,it,val(OLD,k));if(f>=0){sc++;ex+=f}}
    if(ex>bs){bs=ex;best=p;hits=sc}}
  // ship names: text added before/after the name
  const veh=[];
  for(const [lk,[k,u]] of OLD.map){if(!lk.startsWith("vehicle_name")||/_short$|desc/.test(lk))continue;
    const b=BASE?val(BASE,k):null;
    const m=/^(\d+\s*[.)\-]\s*|\[[^\]]*\]\s*|[★☆*#]+\s*)(.+)$/.exec(u);
    if(b!=null){if(u===b)continue;const n=x=>x.replace(/["'“”]/g,"");const nu=n(u),nb=n(b);
      if(nu.endsWith(nb)){veh.push({k,pre:nu.slice(0,nu.length-nb.length),suf:""});continue}
      if(nu.startsWith(nb)){veh.push({k,pre:"",suf:nu.slice(nb.length)});continue}}
    if(m)veh.push({k,pre:m[1],suf:""})}
  veh.sort((a,b)=>(parseInt(a.pre)||999)-(parseInt(b.pre)||999));
  return {tpl:best&&hits>=Math.max(3,items.length*0.3)?best:null,hits,total:items.length,veh}}

/* ---------------- UI ---------------- */
function save(){try{localStorage.setItem(LSK,JSON.stringify({tpl:TPL,veh:VEH,note:NOTE}))}catch(e){}}
function sample(){const base=BASE||OLD;const ks=["item_namecool_aegs_s01_tundra","item_namepowr_jspn_s01_jsrmk2","item_nameshld_godi_s01_allstop_scitem","item_nameqdrv_rsi_s01_lightfire","item_name_radr_bltr_s01_hunter"];
  const out=[];for(const k of ks.concat(Object.keys(COMP))){if(out.length>=4)break;const it=base?item(k,base):null;if(it&&!out.some(o=>o.type===it.type))out.push(it)}
  if(!out.length)out.push({type:"COOL",size:"1",grade:"D",cls:"MIL",name:"Tundra"},{type:"QDRV",size:"2",grade:"A",cls:"CMP",name:"Spectre"});
  return out}
function drawTpl(){
  const sel=(tk,i)=>tk.k==="type"||tk.k==="class"?`<select data-i="${i}">${["code","long","short","letter"].map(s=>`<option value="${s}" ${tk.s===s?"selected":""}>${t("st"+s[0].toUpperCase()+s.slice(1))}</option>`).join("")}</select>`:"";
  const lab={type:"tType",class:"tClass",size:"tSize",grade:"tGrade",name:"tName"};
  $("#tpl").innerHTML=TPL.map((tk,i)=>tk.k==="lit"?`<span class="tok lit">${t("tText")} <input data-i="${i}" value="${esc(tk.v)}"><button data-l="${i}" title="←">‹</button><button data-r="${i}" title="→">›</button><button data-x="${i}">✕</button></span>`
    :`<span class="tok">${t(lab[tk.k])} ${sel(tk,i)}<button data-l="${i}">‹</button><button data-r="${i}">›</button><button data-x="${i}">✕</button></span>`).join("")||`<span class="hint">${t("off")}</span>`;
  $("#addt").innerHTML=`<span class="hint">${t("addTok")}</span>`+["type","class","size","grade","name","lit"].map(k=>`<button class="btn" data-a="${k}">+ ${t(k==="lit"?"tText":lab[k])}</button>`).join("");
  $("#prev").innerHTML=sample().map(it=>`<span class="k">${esc(it.name)}</span><span class="v">${esc(isOff(TPL)?it.name:render(TPL,it))}</span>`).join("")+(COMPV?`<span class="k"></span><span class="hint">${t("compD",Object.keys(COMP).length,esc(COMPV.split("-")[0]))}</span>`:"");
  $("#tpl").querySelectorAll("select").forEach(s=>s.onchange=()=>{TPL[+s.dataset.i].s=s.value;save();drawTpl()});
  $("#tpl").querySelectorAll("input").forEach(s=>s.oninput=()=>{TPL[+s.dataset.i].v=s.value;save();drawPrev()});
  $("#tpl").querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{TPL.splice(+b.dataset.x,1);save();drawTpl()});
  $("#tpl").querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{const i=+b.dataset.l;if(i>0){[TPL[i-1],TPL[i]]=[TPL[i],TPL[i-1]];save();drawTpl()}});
  $("#tpl").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const i=+b.dataset.r;if(i<TPL.length-1){[TPL[i+1],TPL[i]]=[TPL[i],TPL[i+1]];save();drawTpl()}});
  $("#addt").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const k=b.dataset.a;TPL.push(k==="lit"?{k,v:" "}:k==="type"||k==="class"?{k,s:"code"}:{k});save();drawTpl()})}
function drawPrev(){$("#prev").querySelectorAll(".v").forEach((e,i)=>{const it=sample()[i];if(it)e.textContent=isOff(TPL)?it.name:render(TPL,it)})}
const PRESETS={
 ud:[{k:"type",s:"code"},{k:"lit",v:" -"},{k:"class",s:"code"},{k:"lit",v:" -"},{k:"size"},{k:"lit",v:"-"},{k:"grade"},{k:"lit",v:" -"},{k:"name"}],
 ss:[{k:"class",s:"short"},{k:"lit",v:"/"},{k:"size"},{k:"lit",v:"/"},{k:"grade"},{k:"lit",v:" "},{k:"name"}],
 br:[{k:"lit",v:"["},{k:"size"},{k:"grade"},{k:"lit",v:" "},{k:"class",s:"short"},{k:"lit",v:"] "},{k:"name"}],
 off:[]};
function vname(k){const b=BASE||OLD;return b?(val(b,k)||k):k}
function drawVeh(){
  $("#vt").innerHTML=VEH.map((v,i)=>`<tr><td><input data-p="${i}" value="${esc(v.pre)}" title="${t("before")}"></td><td class="nm">${esc(vname(v.k))}</td><td><input data-s="${i}" value="${esc(v.suf)}" title="${t("after")}"></td><td class="res">${esc(v.pre+vname(v.k)+v.suf)}</td><td><button data-u="${i}">▲</button> <button data-d="${i}">▼</button> <button data-x="${i}">✕</button></td></tr>`).join("");
  $("#vt").querySelectorAll("[data-p]").forEach(e=>e.oninput=()=>{VEH[+e.dataset.p].pre=e.value;save();e.closest("tr").querySelector(".res").textContent=VEH[+e.dataset.p].pre+vname(VEH[+e.dataset.p].k)+VEH[+e.dataset.p].suf});
  $("#vt").querySelectorAll("[data-s]").forEach(e=>e.oninput=()=>{VEH[+e.dataset.s].suf=e.value;save();e.closest("tr").querySelector(".res").textContent=VEH[+e.dataset.s].pre+vname(VEH[+e.dataset.s].k)+VEH[+e.dataset.s].suf});
  $("#vt").querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{VEH.splice(+b.dataset.x,1);save();drawVeh()});
  $("#vt").querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const i=+b.dataset.u;if(i>0){[VEH[i-1],VEH[i]]=[VEH[i],VEH[i-1]];save();drawVeh()}});
  $("#vt").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const i=+b.dataset.d;if(i<VEH.length-1){[VEH[i+1],VEH[i]]=[VEH[i],VEH[i+1]];save();drawVeh()}})}
$("#bNum").onclick=()=>{VEH.forEach((v,i)=>{v.pre=(i+1)+". "+v.pre.replace(/^\d+\s*[.)\-]\s*/,"")});save();drawVeh()};
$("#vq").oninput=()=>{const q=$("#vq").value.trim().toLowerCase(),b=BASE||OLD,r=$("#vres");
  if(!q||!b){r.hidden=true;return}
  const hits=[];for(const [lk,[k,v]] of b.map){if(lk.startsWith("vehicle_name")&&!/_short$|desc/i.test(lk)&&v.toLowerCase().includes(q)&&!VEH.some(x=>x.k.toLowerCase()===lk)){hits.push([k,v]);if(hits.length>=30)break}}
  r.innerHTML=hits.map(([k,v])=>`<div data-k="${esc(k)}">${esc(v)}</div>`).join("");r.hidden=!hits.length;
  r.querySelectorAll("div").forEach(d=>d.onclick=()=>{VEH.push({k:d.dataset.k,pre:"",suf:""});$("#vq").value="";r.hidden=true;save();drawVeh()})};

function readFile(f){return f.text()}
async function loadOld(f){const txt=await readFile(f);const ini=parseIni(txt);
  if(ini.n<1000){$("#detect").innerHTML=`<p class="err">${t("notIni")}</p>`;return}
  OLD=ini;const d=detect();
  if(d.tpl){TPL=d.tpl}
  VEH=d.veh;save();
  const ss=/\[BP\]|<EM4>/.test(txt.slice(0,3000000));
  $("#detect").innerHTML=`<p class="${d.tpl?"ok":"warn"}">${d.tpl?"✓ "+t("detOk",d.hits,d.total,d.veh.length):t("detNone",d.veh.length)}</p>`+(ss?`<p class="hint">${t("detSS")}</p>`:"");
  $("#s1st").textContent="✓ "+f.name;drawTpl();drawVeh()}
async function setBase(txt,label){const ini=parseIni(txt);if(ini.n<1000)throw new Error(t("notIni"));BASE=ini;BASEN=label;
  $("#baseInfo").innerHTML=`<p class="ok">✓ ${t("baseOk",esc(label),ini.n.toLocaleString())}</p>`;$("#s2st").textContent="✓";$("#bGo").disabled=false;
  if(OLD){const d=detect();if(!VEH.length)VEH=d.veh}drawTpl();drawVeh()}
$("#bSS").onclick=async()=>{const bi=$("#baseInfo");bi.innerHTML=`<p class="hint">${t("loading")}</p>`;
  try{const R="https://raw.githubusercontent.com/MrKraken/StarStrings/master/";
    const [ini,rd]=await Promise.all([fetch(R+"src/For_Players/Data/Localization/english/global.ini",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}),fetch(R+"readme.md",{cache:"no-store"}).then(r=>r.ok?r.text():"").catch(()=>"")]);
    const b=/Build:\s*([^\]\*]+)\]/.exec(rd);await setBase(ini,"StarStrings"+(b?" · "+b[1].trim():""))}
  catch(e){bi.innerHTML=`<p class="err">${t("baseErr",esc(e.message||e))}</p>`}};
$("#bOwnBase").onclick=()=>$("#fBase").click();
$("#fBase").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{await setBase(await readFile(f),f.name)}catch(er){$("#baseInfo").innerHTML=`<p class="err">${esc(er.message)}</p>`}};
const drop=$("#dropOld");drop.onclick=()=>$("#fOld").click();
$("#fOld").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)loadOld(f)};
drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("hov")});drop.addEventListener("dragleave",()=>drop.classList.remove("hov"));
drop.addEventListener("drop",e=>{e.preventDefault();drop.classList.remove("hov");const f=e.dataTransfer.files[0];if(f)loadOld(f)});
$("#bFresh").onclick=()=>{OLD=null;TPL=PRESETS.ud.map(x=>({...x}));VEH=[];save();$("#detect").innerHTML="";$("#s1st").textContent="";drawTpl();drawVeh()};
document.querySelectorAll("[data-p]").forEach(b=>{if(b.closest("#s3"))b.onclick=()=>{TPL=PRESETS[b.dataset.p].map(x=>({...x}));save();drawTpl()}});
$("#bSaveCfg").onclick=()=>{const blob=new Blob([JSON.stringify({app:"shogy-label-forge",v:1,tpl:TPL,veh:VEH},null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="label-forge-settings.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
$("#bLoadCfg").onclick=()=>$("#fCfg").click();
$("#fCfg").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const d=JSON.parse(await f.text());if(Array.isArray(d.tpl))TPL=d.tpl;if(Array.isArray(d.veh))VEH=d.veh;save();drawTpl();drawVeh();$("#s1st").textContent="✓ "+f.name}catch(er){$("#detect").innerHTML=`<p class="err">${esc(er.message)}</p>`}};

$("#bGo").onclick=()=>{
  if(!BASE){$("#out").innerHTML=`<p class="warn">${t("needBase")}</p>`;return}
  const rep=new Map();let nc=0,nv=0;
  for(const k of compKeys(BASE)){const it=item(k,BASE);if(!it)continue;rep.set(k,isOff(TPL)?it.name:render(TPL,it));nc++}
  for(const v of VEH){const b=val(BASE,v.k);if(b==null)continue;rep.set(v.k.toLowerCase(),v.pre+b+v.suf);nv++}
  // optional credit line, appended after StarStrings' own login message (never replaces it)
  const lm=val(BASE,NOTE_KEY);
  if(NOTE&&lm!=null&&!lm.includes("Label Forge"))rep.set(NOTE_KEY,lm+"\\n\\n"+NOTE_TXT);
  const lines=BASE.text.split("\n");
  for(let i=0;i<lines.length;i++){const l=lines[i],j=l.indexOf("=");if(j<=0)continue;const k=l.slice(0,j).replace(/^﻿/,"").toLowerCase();
    if(rep.has(k)){const cr=l.endsWith("\r")?"\r":"";lines[i]=l.slice(0,j+1)+rep.get(k)+cr}}
  let out=lines.join("\n");if(!out.startsWith("﻿"))out="﻿"+out;
  const blob=new Blob([out],{type:"text/plain;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="global.ini";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  $("#out").innerHTML=`<p class="ok">✓ ${t("done",nc,nv)} <span class="hint">(${esc(BASEN)})</span></p>`};

function renderAll(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.getAttribute("data-t")));
  $("#vq").placeholder=t("vq");
  $("#flags").innerHTML=LANGS.map(l=>`<button type="button" data-l="${l}" class="${l===LANG?"on":""}" title="${NAMES[l]}" aria-label="${NAMES[l]}">${FLAGS[l]}</button>`).join("");
  drawTpl();drawVeh()}
$("#flags").addEventListener("click",ev=>{const b=ev.target.closest("button[data-l]");if(!b)return;LANG=b.getAttribute("data-l");try{localStorage.setItem("scbp-lang",LANG)}catch(e){}renderAll()});
try{const s=JSON.parse(localStorage.getItem(LSK)||"null");if(s){TPL=s.tpl||[];VEH=s.veh||[];if(s.note===false)NOTE=false}else TPL=PRESETS.ud.map(x=>({...x}))}catch(e){TPL=PRESETS.ud.map(x=>({...x}))}
renderAll();
$("#cNote").checked=NOTE;$("#cNote").onchange=e=>{NOTE=e.target.checked;save()};
fetch("../blueprints/data/components.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{COMP={};for(const [k,v] of Object.entries(d.items||{}))if(/^item_name/.test(k)&&!/_default$/.test(k))COMP[k]=v;COMPV=d.v||"";drawTpl()}).catch(()=>{});
</script>
