<html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#0b1716;--card:#112523;--line:#24433f;--txt:#d7ece8;--mut:#86a8a2;--gold:#e8c35a;--ok:#5fd38d;--warn:#ffb24a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:2;background:#0b1716f2;border-bottom:1px solid var(--line);padding:10px 12px}
h1{font-size:18px;margin:0 0 4px;color:var(--gold)}.sub{color:var(--mut);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:8px}
.bar input[type=search]{flex:1 1 180px;background:#0f201f;border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:6px;font-size:15px}
.bar label{font-size:13px;color:var(--mut);display:flex;gap:5px;align-items:center}
.prog{height:6px;background:#1a3330;border-radius:3px;margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok);width:0}
main{padding:10px 12px 60px;max-width:900px;margin:0 auto}
.g{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:0 0 10px;overflow:hidden}
.g>summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;align-items:center;gap:10px}
.g>summary::-webkit-details-marker{display:none}
.q{font:700 17px/1.2 ui-monospace,Consolas,monospace;color:#fff;background:#1d3a36;padding:4px 8px;border-radius:5px;letter-spacing:.04em}
.cnt{color:var(--mut);font-size:13px;margin-left:auto;white-space:nowrap}.cnt b{color:var(--ok)}
.copy{background:none;border:1px solid var(--line);color:var(--mut);border-radius:5px;padding:3px 7px;font-size:12px}
.it{display:flex;gap:10px;padding:8px 12px;border-top:1px solid #1b3532;align-items:flex-start}
.it input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--ok);flex:none}
.it.done .nm{text-decoration:line-through;color:var(--mut)}
.nm{font-weight:600}.meta{font-size:12px;color:var(--mut)}
.tag{font-size:11px;padding:0 5px;border-radius:3px;margin-left:6px;vertical-align:1px}
.tag.no{background:#4a1d1d;color:#ffb3a8}.tag.va{background:#3d3214;color:#ffd98a}
.sh{font-size:12px;color:#a9d6cf;margin-top:2px}.sh span{display:inline-block;margin-right:10px}
.none{font-size:12px;color:#7d8f8c;margin-top:2px}
.hide-done .it.done{display:none}.hide-done .g.alldone{display:none}
.only-sold .it.nosold{display:none}.only-sold .g.nosold{display:none}
footer{color:var(--mut);font-size:12px;text-align:center;padding:20px}
</style></head><body>

const K="foto-done-v1";let done={};try{done=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(done))}catch(e){}};

const fmt=n=>Number(n).toLocaleString("hr-HR");
function render(){
  const f=document.getElementById("f").value.trim().toLowerCase();
  let h="",all=0,dn=0,sold=0;
  for(const g of D.groups){
    const its=g.items.filter(x=>!f||x.n.toLowerCase().includes(f)||g.q.toLowerCase().includes(f));

    const gs=its.filter(x=>x.sh.length).length,gd=its.filter(x=>done[x.n]).length;

    h+=`<details class="g ${gd===its.length?"alldone":""} ${gs?"":"nosold"}" ${f?"open":""}><summary><span class="q">${esc(g.q)}</span><button class="copy" data-q="${esc(g.q)}">kopiraj</button><span class="cnt"><b>${gd}</b>/${its.length} · u prodaji ${gs}</span></summary>`;

      const sh=x.sh.length?`<div class="sh">${x.sh.map(s=>`<span>🛒 ${esc(s[0]||s[1])}${s[2]&&s[2]!=="Stanton"?" ("+esc(s[2])+")":""} · ¤${fmt(s[3])}</span>`).join("")}</div>`:`<div class="none">${x.k?"nije pronađeno u shopovima":"još nije provjereno"}</div>`;
      h+=`<label class="it ${done[x.n]?"done":""} ${x.sh.length?"":"nosold"}"><input type="checkbox" data-n="${esc(x.n)}" ${done[x.n]?"checked":""}><div><span class="nm">${esc(x.n)}</span><span class="tag ${x.v?"va":"no"}">${x.v?"varijanta":"nema slike"}</span><div class="meta">${esc(x.c)} · ${esc(x.s)}</div>${sh}</div></label>`;
    }
    h+="</details>";
  }
  document.getElementById("m").innerHTML=h||'<p class="sub">Ništa ne odgovara.</p>';
  document.getElementById("sum").textContent=`Kiosk ${D.v.split("-")[0]} · ${all} predmeta bez prave slike · ${sold} u prodaji · snimljeno ${dn}`;
  document.getElementById("pg").style.width=(all?dn/all*100:0)+"%";
  document.querySelectorAll(".it input").forEach(c=>c.onchange=()=>{if(c.checked)done[c.dataset.n]=Date.now();else delete done[c.dataset.n];save();c.closest(".it").classList.toggle("done",c.checked)});
  document.querySelectorAll(".copy").forEach(b=>b.onclick=e=>{e.preventDefault();navigator.clipboard&&navigator.clipboard.writeText(b.dataset.q);b.textContent="✓";setTimeout(()=>b.textContent="kopiraj",900)});
}
const cls=()=>{document.body.classList.toggle("only-sold",document.getElementById("sold").checked);document.body.classList.toggle("hide-done",document.getElementById("hd").checked)};
