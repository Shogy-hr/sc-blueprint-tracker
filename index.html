:root{--ff:Rajdhani,"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;--tx:#d5ece8;--dim:#7fa7a2;--mut:#55807b;--line:#24504c;--gold:#e2cf78;--ok:#79e0b4}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% 35%,#3a2418 0,#1b110c 55%,#0c0806 100%);color:var(--tx);font:500 16px/1.35 var(--ff);min-height:100vh;display:flex;flex-direction:column;padding:14px}
.frame{flex:1;max-width:1100px;width:100%;margin:0 auto;border:1px solid #0f2322;border-radius:10px;background:radial-gradient(ellipse at 50% 0%,#174745 0,#0c2a29 45%,#081d1d 100%);box-shadow:0 0 0 6px #1b1c1d,0 0 0 8px #2b2c2d,0 20px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;padding:18px 22px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid #0a1716;padding-bottom:12px}
.logo{display:flex;align-items:center;gap:12px}
.logo-img{width:60px;height:60px;display:block;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
.logo b{display:block;font:700 30px/1 var(--ff);letter-spacing:.04em;color:#f1fbf9}
.logo small{display:block;font:600 14px/1.2 var(--ff);letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-top:3px}
.sp{flex:1}
.flags{display:flex;gap:6px;flex-wrap:wrap}
.flags button{border:1px solid #2b5550;background:#132f2e;border-radius:4px;padding:5px;cursor:pointer;line-height:0}
.flags button.on{border-color:var(--gold);background:#2a2d14}
.flags svg{width:26px;height:17px;display:block;border-radius:2px}.flags svg.fhr{width:34px}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 0}
.hello{text-align:center;margin:0 0 26px}
.hello h1{font:700 34px/1.1 var(--ff);letter-spacing:.06em;margin:0;color:#f1fbf9;text-transform:uppercase}
.hello p{margin:8px 0 0;color:var(--dim);font-size:18px}
.sstat{display:inline-grid;grid-template-columns:auto auto;gap:3px 14px;align-items:center;margin:14px auto 0;padding:9px 16px;border:1px solid #23504b;background:#0b2424cc;font-size:14.5px;text-align:left}
.sstat .k{display:flex;align-items:center;gap:8px;font:700 14px var(--ff);letter-spacing:.1em;color:#dff3ef}
.sstat .v{color:var(--dim)}.sstat .v b{color:#f1fbf9;font-weight:700}
.sstat .nx{grid-column:1/-1;border-top:1px solid #1d4440;margin-top:4px;padding-top:5px;color:var(--dim);font-size:13.5px}
.sstat .nx b{color:#f0d264}
.sstat .eta{grid-column:1/-1;color:var(--dim);font-size:13.5px;cursor:help}
.sstat .eta b{color:#f1fbf9}.sstat .eta i{font-style:normal;opacity:.75}
.dot{width:10px;height:10px;border-radius:50%;background:#5d6f6c;flex:0 0 10px}
.dot.ok{background:#3ee08a;box-shadow:0 0 0 0 #3ee08a99;animation:dp 2.2s infinite}
.dot.notice{background:#f0d264}.dot.disrupted{background:#ff9f43}.dot.down{background:#ff5252;animation:dp 1.2s infinite}
.dot.ptu{background:#5fc8f2}
@keyframes dp{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.dot.ok{color:#3ee08a88}.dot.down{color:#ff525288}
@media (prefers-reduced-motion:reduce){.dot{animation:none!important}}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.card{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;text-decoration:none;color:var(--tx);border:1px solid #2b5550;background:linear-gradient(160deg,rgba(26,61,58,.85),rgba(8,30,31,.85));padding:26px 24px 22px;border-radius:6px;transition:border-color .15s,transform .15s,background .15s;min-height:260px}
.card:hover,.card:focus-visible{border-color:var(--gold);transform:translateY(-2px);background:linear-gradient(160deg,rgba(42,45,20,.9),rgba(8,30,31,.9));outline:none}
.card .ic{width:64px;height:64px;color:var(--gold)}
.card h2{margin:0;font:700 28px/1.05 var(--ff);letter-spacing:.05em;text-transform:uppercase;color:#f1fbf9}
.card h2 small{display:block;font:600 15px/1.2 var(--ff);letter-spacing:.16em;color:var(--gold);margin-bottom:4px}
.card p{margin:0;color:#b9d6d1;font-size:17px;flex:1}
.card .go{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;border:2px solid #d6c56b;background:linear-gradient(#3b3c1c,#2a2b12);color:#f6ecb2;font:700 18px var(--ff);letter-spacing:.08em;padding:8px 20px;text-transform:uppercase;clip-path:polygon(0 0,90% 0,100% 30%,100% 100%,0 100%)}
.card .tag{position:absolute;top:18px;right:18px;font:700 12px var(--ff);letter-spacing:.1em;padding:4px 10px;border-radius:3px;text-transform:uppercase}
.tag.soon{background:#4a3a14;color:#ffd27a;border:1px solid #8a6a26}
.tag.live{background:#103c30;color:var(--ok);border:1px solid #2b7a5f}
.meta{font-size:14px;color:var(--mut);letter-spacing:.04em}
.bmc{display:inline-flex;align-items:center;gap:7px;text-decoration:none;white-space:nowrap;color:#2a1a0c;background:linear-gradient(#ffd96b,#f2b33d);border:1px solid #ffe7a1;border-radius:20px;padding:4px 13px 4px 8px;font:700 14px/1 var(--ff);letter-spacing:.03em;box-shadow:0 0 0 0 rgba(255,205,90,.55);animation:bmcGlow 3.2s ease-in-out infinite;transition:transform .15s,filter .15s}
.bmc:hover,.bmc:focus-visible{transform:translateY(-1px) scale(1.04);filter:brightness(1.08);outline:none}
.bmc .cup{width:22px;height:22px;color:#4a2a12;overflow:visible;transform-origin:50% 90%;animation:bmcTilt 3.2s ease-in-out infinite}
.bmc .cup .mug{color:#5b3416}
.bmc .steam path{opacity:0;animation:bmcSteam 2.4s ease-in-out infinite}
.bmc .steam .s2{animation-delay:.5s}.bmc .steam .s3{animation-delay:1s}
@keyframes bmcSteam{0%{opacity:0;transform:translateY(3px)}35%{opacity:.9}100%{opacity:0;transform:translateY(-4px)}}
@keyframes bmcTilt{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-9deg)}86%{transform:rotate(6deg)}93%{transform:rotate(-3deg)}}
@keyframes bmcGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,205,90,0)}50%{box-shadow:0 0 14px 2px rgba(255,205,90,.35)}}
@media (prefers-reduced-motion:reduce){.bmc,.bmc .cup,.bmc .steam path{animation:none}.bmc .steam path{opacity:.7}}
.bmc.hd{font-size:16px;padding:6px 16px 6px 10px}.bmc.hd .cup{width:26px;height:26px}
.support{display:flex;justify-content:center;margin-top:26px}
.vid{display:flex;gap:22px;align-items:center;margin-top:26px;padding:16px;border:1px solid var(--line,#2c5a55);background:#0b2424cc}
.vfac{position:relative;flex:0 0 420px;aspect-ratio:16/9;padding:0;border:1px solid #3f7a73;background:#000;cursor:pointer;overflow:hidden}
.vfac img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s,filter .4s}
.vfac:hover img{transform:scale(1.03);filter:brightness(1.1)}
.vplay{position:absolute;left:76%;top:50%;width:76px;height:54px;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 10px #000a);transition:transform .2s}
.vfac:hover .vplay{transform:translate(-50%,-50%) scale(1.1)}
.vfac iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vtxt b{display:block;font-size:24px;color:#f0d264;letter-spacing:.04em}
.vtxt p{margin:6px 0 8px;font-size:17px}
.vtxt small{color:#8fbcb5;font-size:13px}.vtxt a{color:#9fd8d0;font-size:13px}
.bmc.big2{font-size:19px;padding:10px 22px 10px 14px;border-radius:26px}.bmc.big2 .cup{width:32px;height:32px}

/* animated previews (kept above the text, never behind it) */
.pv{position:relative;height:150px;margin:-26px -24px 6px;overflow:hidden;border-bottom:1px solid #2b5550;border-radius:6px 6px 0 0;background:#06181a}
.pv:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,30,31,0) 55%,rgba(8,30,31,.9));pointer-events:none;z-index:1}
.pv-gal{--sw:1575px}
.pv-gal .strip{position:absolute;inset:0;background:url(assets/preview/galaktopedija-strip.webp) 0 0/auto 100% repeat-x;animation:pvPan 80s linear infinite}
@keyframes pvPan{to{background-position-x:calc(-1 * var(--sw))}}
.pv-kiosk .shot{position:absolute;inset:0;background:url(assets/preview/kiosk.webp) 0 0/cover;transform-origin:30% 30%;animation:pvKb 22s ease-in-out infinite alternate}
@keyframes pvKb{from{transform:scale(1.08) translate(0,0)}to{transform:scale(1.35) translate(-14%,-8%)}}
.pv .scan{position:absolute;left:0;right:0;top:0;height:2px;z-index:2;background:#7be9ffaa;box-shadow:0 0 14px #58e2ff;animation:pvScan 5s linear infinite}
@keyframes pvScan{from{top:0}to{top:calc(100% - 2px)}}
.pv-kiosk .fab{position:absolute;left:14px;bottom:12px;z-index:3;display:flex;align-items:center;gap:10px;padding:5px 10px;background:#081d1df0;border:1px solid #d6c56b;border-radius:3px;font:700 12px/1 var(--ff);letter-spacing:.12em;color:#f6ecb2}
.pv-kiosk .fab i{display:block;width:90px;height:6px;background:#2a2b12;border:1px solid #6b6230;overflow:hidden}
.pv-kiosk .fab s{display:block;height:100%;width:0;background:linear-gradient(90deg,#b6a552,#f2dc7a);animation:pvFab 6s ease-in-out infinite}
@keyframes pvFab{0%{width:0}80%{width:100%}100%{width:100%}}
.card .tag{z-index:4}
.card:hover .pv-gal .strip{animation-duration:40s}
@media (prefers-reduced-motion:reduce){.pv *{animation:none!important}}

.support{flex-wrap:wrap;align-items:center;gap:18px 26px}
.refer{display:flex;flex-direction:column;gap:7px;min-width:0}
.rf-head b{display:block;font:700 15px/1.1 var(--ff);letter-spacing:.14em;color:#f1fbf9;text-transform:uppercase}
.rf-head small{display:block;font-size:14px;color:var(--dim);margin-top:2px}
.rf-box{display:flex;align-items:stretch;border:1px solid #2f6a73;border-radius:8px;background:linear-gradient(180deg,#123a44,#0b2a33);overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.rf-code{position:relative;border:0;background:transparent;color:#f1fbf9;font:700 19px/1 var(--ff);letter-spacing:.08em;padding:12px 20px 14px;cursor:copy}
.rf-code i{position:absolute;left:20px;right:20px;bottom:6px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--gold),#79e0b4)}
.rf-code:hover,.rf-code:focus-visible{background:rgba(255,255,255,.05);outline:none}
.rf-code.ok span{color:var(--ok)}
.rf-go{display:flex;align-items:center;gap:7px;padding:0 18px;border-left:1px solid #2f6a73;background:#163f49;color:#a8e9f5;text-decoration:none;font:700 16px var(--ff);letter-spacing:.04em;white-space:nowrap}
.rf-go svg{width:18px;height:18px}
.rf-go:hover,.rf-go:focus-visible{background:#1d5260;color:#fff;outline:none}
.hnote{flex-basis:100%;font-size:12.5px;opacity:.8}
footer a{color:inherit;text-decoration:underline;text-underline-offset:2px;opacity:.9}footer a:hover{opacity:1;color:#fff}
footer{border-top:1px solid #0a1716;padding-top:12px;font-size:13.5px;color:var(--mut);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
footer b{color:var(--dim);font-weight:600}
@media (max-width:760px){
 body{padding:6px}
 .frame{padding:12px 12px;box-shadow:0 0 0 3px #1b1c1d}
 .logo b{font-size:24px}.logo-img{width:50px;height:50px}
 header{gap:10px}.sp{display:none}
 .flags svg{width:24px;height:16px}.flags svg.fhr{width:32px}
 main{padding:18px 0}
 .hello h1{font-size:24px}.hello p{font-size:16px}
 .cards{grid-template-columns:1fr;gap:14px}
 .vid{flex-direction:column;align-items:stretch;padding:12px}.vfac{flex:none;width:100%}.vtxt{text-align:center}
 .bmc.hd{display:none}
 .support{flex-direction:column}.refer{align-items:center;text-align:center}.rf-code{font-size:17px;padding:11px 14px 13px}.rf-code i{left:14px;right:14px}.rf-go{padding:0 14px}
 .card{min-height:0;padding:20px 18px 18px}
 .pv{height:120px;margin:-20px -18px 4px}.pv-gal{--sw:1260px}
 .card .ic{width:48px;height:48px}
 .card h2{font-size:24px}
 .card p{font-size:16px}
}
</style>

 var sv=STAT.server||{},sum=sv.summary||"unknown",lv=STAT.live&&STAT.live.version,pv=STAT.ptu&&STAT.ptu.version;

 el.innerHTML='<span class="k"><i class="dot '+e(sum)+'"></i>'+t("sLive")+'</span><span class="v" title="'+e(tip)+'"><b>'+e(lv||"–")+'</b> · '+t("s"+sum)+'</span>'+
  '<span class="k"><i class="dot '+(pv?"ptu":"")+'"></i>'+t("sPtu")+'</span><span class="v">'+(pv?'<b>'+e(pv)+'</b> · '+t("sPtuOn"):t("sNoPtu"))+'</span>'+
  '<span class="nx">'+t("sNext")+' '+(pv&&pv!==lv?t("sNextV").replace("{0}","<b>"+e(pv)+"</b>"):t("sNextNone"))+'</span>'+etaRow(STAT.next,pv,lv,e);
 el.title=t("sSrc").replace("{0}",when);el.hidden=false}
