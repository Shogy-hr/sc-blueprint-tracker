name: Update game data and publish

on:
  schedule:
    - cron: "23 */6 * * *"      # every 6 hours
  workflow_dispatch:            # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: pip install pillow
      - name: Sync game data, PTU and patch status
        run: python3 tools/update.py
      - name: Save changed game data to the repository
        run: |
          git config user.name "bp-tracker-bot"
          git config user.email "bp-tracker-bot@users.noreply.github.com"
          git add -A blueprints tools foto
          git reset -q -- blueprints/data/status.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Game data $(python3 -c "import json;print(json.load(open('tools/catalog.json'))['v'])")"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
